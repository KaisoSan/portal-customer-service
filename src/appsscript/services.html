<section class="container pb-5">

        <div class="card-body text-center p-4">

          <div class="service-icon">
            <i class="bi bi-person-vcard"></i>
          </div>

          <h3 class="fw-bold">
            SIMPLI
          </h3>

          <p class="text-muted">

          <h3 class="fw-bold">

            Pengaduan

          </h3>

          <p class="text-muted">
